<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.65" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.15); }
    }
    @keyframes dashTravel {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes signalPulse {
      0%, 100% { opacity: 0.3; r: 3; }
      50% { opacity: 1; r: 5; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate 2s; transform-origin: 1000px 300px; }
    .flow-line { stroke-dasharray: 12, 12; animation: dashTravel 15s linear infinite; }
    .pill-1 { animation: floatPill1 6s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 7s ease-in-out infinite 1s; }
    .pill-3 { animation: floatPill3 5.5s ease-in-out infinite 0.5s; }
    .sig-1 { animation: signalPulse 2s infinite ease-in-out; }
    .sig-2 { animation: signalPulse 2.5s infinite ease-in-out 0.8s; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Ambient Background Orbs -->
  <circle class="orb-1" cx="220" cy="120" r="180" fill="#4338ca" filter="url(#softGlow)" />
  <circle class="orb-2" cx="980" cy="280" r="160" fill="#0284c7" filter="url(#softGlow)" />

  <!-- Cybernetic Infrastructure Grid -->
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Animated Data Highway Lines (Background Architecture) -->
  <g opacity="0.4">
    <path class="flow-line" d="M 0,90 Q 300,160 600,100 T 1200,120" fill="none" stroke="#6366f1" stroke-width="1.8" />
    <path class="flow-line" d="M 0,330 Q 400,260 800,320 T 1200,270" fill="none" stroke="#06b6d4" stroke-width="1.8" />
    <circle cx="300" cy="128" r="4" fill="#818cf8" class="sig-1" />
    <circle cx="800" cy="320" r="4" fill="#38bdf8" class="sig-2" />
    <circle cx="600" cy="100" r="4.5" fill="#38bdf8" class="sig-1" />
  </g>

  <!-- Modern Tech Badges / Pills (Dynamic floating UI cards) -->
  <g class="pill-1">
    <rect x="75" y="45" width="165" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
    <circle cx="95" cy="62" r="5" fill="#a5b4fc" />
    <text x="110" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" letter-spacing="0.5">DEV PLATFORMS</text>
  </g>

  <g class="pill-2">
    <rect x="960" y="55" width="165" height="34" rx="17" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.2" opacity="0.9" />
    <circle cx="980" cy="72" r="5" fill="#38bdf8" />
    <text x="995" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#bae6fd" letter-spacing="0.5">API LIFECYCLE</text>
  </g>

  <g class="pill-3">
    <rect x="520" y="345" width="160" height="34" rx="17" fill="#142634" stroke="#06b6d4" stroke-width="1.2" opacity="0.9" />
    <circle cx="540" cy="362" r="5" fill="#67e8f9" />
    <text x="555" y="367" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#a5f3fc" letter-spacing="0.5">CI/CD &amp; IaC</text>
  </g>

  <!-- Foreground Content Container (Ensures 100% readability without overlap) -->
  <g id="foreground-content">
    <!-- Top Pill Category -->
    <rect x="460" y="98" width="280" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="600" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="2" text-anchor="middle">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title (Gradient Fill + Drop Shadow) -->
    <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-0.5">
      Awesome SDKs, APIs &amp; Automation
    </text>

    <!-- Glowing Divider Accent -->
    <rect x="420" y="222" width="360" height="3" rx="1.5" fill="url(#accentGlow)" filter="url(#glow)" />

    <!-- Subtitle / Mission Statement -->
    <text x="600" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.2">
      Production-Grade SDKs, API Platforms, CI/CD Orchestration &amp; Infrastructure as Code
    </text>

    <!-- Highlights Row -->
    <text x="600" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1.2">
      ⚡ SAAS DEVELOPER HUBS  •  🛠️ OPEN SOURCE ALTERNATIVES  •  🚀 DORA &amp; DEVOPS
    </text>
  </g>

  <!-- Sleek Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="12" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />
</svg>