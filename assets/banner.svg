<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="accentGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="40%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#93c5fd"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="15"/></filter><pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-width=".8" d="M 40 0 L 0 0 0 40" opacity=".65"/></pattern></defs><style>@keyframes pulseOrb{0%{opacity:.25;transform:scale(1)}50%{opacity:.45;transform:scale(1.15)}}@keyframes dashTravel{0%{stroke-dashoffset:240}}@keyframes floatPill1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatPill2{0%{transform:translateY(0)}50%{transform:translateY(8px)}}@keyframes floatPill3{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes signalPulse{0%{opacity:.3;r:3}50%{opacity:1;r:5}}.orb-1{animation:pulseOrb 8s ease-in-out infinite alternate;transform-origin:200px 100px}.orb-2{animation:pulseOrb 10s ease-in-out infinite alternate 2s;transform-origin:1000px 300px}.flow-line{stroke-dasharray:12,12;animation:dashTravel 15s linear infinite}.pill-1{animation:floatPill1 6s ease-in-out infinite}.pill-2{animation:floatPill2 7s ease-in-out infinite 1s}.pill-3{animation:floatPill3 5.5s ease-in-out infinite .5s}.sig-1{animation:signalPulse 2s infinite ease-in-out}.sig-2{animation:signalPulse 2.5s infinite ease-in-out .8s}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><circle cx="220" cy="120" r="180" fill="#4338ca" class="orb-1" filter="url(#softGlow)"/><circle cx="980" cy="280" r="160" fill="#0284c7" class="orb-2" filter="url(#softGlow)"/><rect width="1200" height="420" fill="url(#cyberGrid)"/><g opacity=".4"><path fill="none" stroke="#6366f1" stroke-width="1.8" d="M 0,90 Q 300,160 600,100 T 1200,120" class="flow-line"/><path fill="none" stroke="#06b6d4" stroke-width="1.8" d="M 0,330 Q 400,260 800,320 T 1200,270" class="flow-line"/><circle cx="300" cy="128" r="4" fill="#818cf8" class="sig-1"/><circle cx="800" cy="320" r="4" fill="#38bdf8" class="sig-2"/><circle cx="600" cy="100" r="4.5" fill="#38bdf8" class="sig-1"/></g><g class="pill-1"><rect width="165" height="34" x="75" y="45" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity=".9" rx="17"/><circle cx="95" cy="62" r="5" fill="#a5b4fc"/><text x="110" y="67" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing=".5">DEV PLATFORMS</text></g><g class="pill-2"><rect width="165" height="34" x="960" y="55" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.2" opacity=".9" rx="17"/><circle cx="980" cy="72" r="5" fill="#38bdf8"/><text x="995" y="77" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing=".5">API LIFECYCLE</text></g><g class="pill-3"><rect width="160" height="34" x="520" y="345" fill="#142634" stroke="#06b6d4" stroke-width="1.2" opacity=".9" rx="17"/><circle cx="540" cy="362" r="5" fill="#67e8f9"/><text x="555" y="367" fill="#a5f3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing=".5">CI/CD &amp; IaC</text></g><g id="foreground-content"><rect width="280" height="28" x="460" y="98" fill="#1e293b" stroke="#334155" stroke-width="1" rx="14"/><text x="600" y="117" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">CURATED AWESOME ECOSYSTEM</text><text x="600" y="195" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-.5" text-anchor="middle">Awesome SDKs, APIs &amp; Automation</text><rect width="360" height="3" x="420" y="222" fill="url(#accentGlow)" filter="url(#glow)" rx="1.5"/><text x="600" y="260" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" letter-spacing=".2" text-anchor="middle">Production-Grade SDKs, API Platforms, CI/CD Orchestration &amp; Infrastructure as Code</text><text x="600" y="295" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" letter-spacing="1.2" text-anchor="middle">⚡ SAAS DEVELOPER HUBS • 🛠️ OPEN SOURCE ALTERNATIVES • 🚀 DORA &amp; DEVOPS</text></g><rect width="1198" height="418" x="1" y="1" fill="none" stroke="#334155" stroke-width="1.5" opacity=".6" rx="12"/></svg>